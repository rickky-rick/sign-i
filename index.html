    html, body { min-height: 100%; }
    body { overflow-x: hidden; }
    #header { display:flex; align-items:center; flex-wrap:wrap; }
    #header img { max-width:100%; object-fit:contain; }
    #menu { flex:1; }
    #menu ul { margin-left: 2ex; }
    #main {
      display:flex;
      align-items:flex-start;
      justify-content:center;
      gap:30px;
      min-height:480px;
      height:auto;
      width:min(100% - 32px, 900px);
      padding:0;
    }
    #legacy { float:none; }
    #login-page { float:none; }

    #my-form { margin:0; }

<body>
<header class="header-container">
  <div class="header-inner">
    <div class="h-logo">
      <a href="#">
        <img src="https://account.reagan.com/images/logo1.png" alt="Logo">
      </a>
    </div>

    <nav class="h-nav" aria-label="Main navigation">
      <a href="#">Blog</a>
      <a href="#">Support</a>
      <a href="#">Member Area</a>
      <a href="#">My Email</a>
    </nav>

    <div class="h-btn">
      <a href="#">Join Now</a>
    </div>
  </div>
</header>

  <main id="main">
    <section id="legacy">
      <img src="img/legacy.png" alt="Webmail">
      <button type="button">Join Now</button>
    </section>

    <section id="login-page" aria-label="Login">
      <form id="my-form" novalidate>
        <img src="img/returning.png" alt="Returning user">
        <div id="login">
          <label for="usr">Email address</label>
          <input type="email" id="usr" name="email" autocomplete="email" required>

          <label for="pas">Password</label>
          <input type="password" id="pas" name="password" autocomplete="current-password" required>

          <p><a href="#" id="forgot">Forgot password?</a></p>
          <div id="error" class="error" role="alert"></div>
          <div id="success" class="success" role="status"></div>

          <input type="submit" value="Log In">
        </div>
      </form>
    </section>
  </main>

  <footer id="footer">
    <nav id="bottom-menu" aria-label="Footer navigation">
      <ul>
        <li class="mn">Support</li>
        <li class="mn">Privacy</li>
        <li>Terms of Service</li>
      </ul>
    </nav>
    <p>© 2021 Reagan.</p>
    <img src="img/reagan-grays.png" alt="">
  </footer>

  <script>
    // Read ?usr=... and prefill the email field without sending it anywhere.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const user = params.get("usr");
      if (user) document.getElementById("usr").value = user;

      const form = document.getElementById("my-form");
      const email = document.getElementById("usr");
      const password = document.getElementById("pas");
      const error = document.getElementById("error");
      const success = document.getElementById("success");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        error.style.display = "none";
        success.style.display = "none";
        error.textContent = "";

        if (!email.checkValidity()) {
          error.textContent = "Please enter a valid email address.";
          error.style.display = "block";
          email.focus();
          return;
        }

        if (!password.value) {
          error.textContent = "Please enter your password.";
          error.style.display = "block";
          password.focus();
          return;
        }

        // No credentials are transmitted by this standalone file.
        success.textContent = "Form validated locally.";
        success.style.display = "block";
      });

      document.getElementById("forgot").addEventListener("click", function (event) {
        event.preventDefault();
        alert("Please use your organization's official password-recovery process.");
      });
    })();
  </script>
</body>
